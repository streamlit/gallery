name: Validate Component Definitions

on:
  pull_request:
    paths:
      - "components/registry/components/**"
      - "components/registry/schemas/**"
      - "components/registry/scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-component-definitions.yml"

jobs:
  validate-submissions:
    name: Validate Component Definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Validate Component Definitions
        run: |
          set -euo pipefail
          uv run python components/registry/scripts/validate.py

      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Validate Changed Component Images
        run: |
          set -euo pipefail

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- "components/registry/components/*.json"
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed component definition files to image-check."
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          for file in "${files[@]}"; do
            cp "${file}" "${tmpdir}/"
          done

          uv run python components/registry/scripts/enrich_images.py --check-only --components-dir "${tmpdir}"
